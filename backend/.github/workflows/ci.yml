# Backend CI (Sprint 4 A7).
# Gates per PR: restore + build (Release) + unit tests + EF model sanity.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore RentCollectionSystem.sln

      - name: Build
        run: dotnet build RentCollectionSystem.sln --configuration Release --no-restore

      - name: Test (unit/integration — excludes browser E2E)
        # The RentCollection.E2ETests suite needs a running app + SQL Server +
        # Playwright, so it runs in the dedicated `e2e.yml` workflow, not this
        # fast gate. Exclude it by namespace.
        run: dotnet test RentCollectionSystem.sln --configuration Release --no-build --verbosity normal --filter "FullyQualifiedName!~RentCollection.E2ETests" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  ef-migrations:
    name: EF migrations sanity check
    runs-on: ubuntu-latest
    needs: dotnet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.10

      - name: Restore
        run: dotnet restore RentCollectionSystem.sln

      - name: Verify model snapshot matches entities
        # `migrations script --idempotent` will print an error if the model
        # has pending changes the migrations don't cover (i.e. someone added
        # an entity/column without `dotnet ef migrations add`). Output is
        # discarded; we only care about the exit code.
        run: |
          dotnet ef migrations script --idempotent \
            --project RentCollection.Infrastructure \
            --startup-project RentCollection.Web > /dev/null

  openapi-artifact:
    name: Publish OpenAPI spec
    runs-on: ubuntu-latest
    needs: dotnet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Web
        run: dotnet build RentCollection.Web --configuration Release

      - name: Generate swagger.json (run app briefly + curl)
        run: |
          dotnet run --project RentCollection.Web --no-build --configuration Release \
            --urls http://localhost:5032 > app.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5032/swagger/v1/swagger.json -o swagger.json; then
              break
            fi
            sleep 1
          done
          kill $APP_PID || true

      - uses: actions/upload-artifact@v4
        if: hashFiles('swagger.json') != ''
        with:
          name: openapi-spec
          path: swagger.json
          retention-days: 30
