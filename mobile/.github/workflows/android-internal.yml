name: Android Internal Testing

# Builds a signed AAB and uploads it to the Google Play "internal" testing
# track via a service-account key. Signing secrets (keystore + passwords) are
# already stored; you only need to add ANDROID_SERVICE_ACCOUNT_JSON.

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        default: "internal"
        required: true
      status:
        description: "Release status (completed | draft)"
        default: "completed"
        required: true

jobs:
  build-upload:
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: com.alrtam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Restore keystore + key.properties from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/viijar-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=viijar-release.jks
          EOF
          echo "keystore bytes: $(wc -c < android/app/viijar-release.jks)"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Verify AAB exists
        run: ls -la build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: com.alrtam
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track }}
          status: ${{ github.event.inputs.status }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
