name: ASC Build Status

on:
  workflow_dispatch: {}

jobs:
  builds:
    runs-on: ubuntu-latest
    env:
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_ID: "6795531787"
    steps:
      - run: pip3 install "pyjwt[crypto]" requests
      - name: List recent TestFlight builds
        run: |
          python3 - <<'PY'
          import os, time, jwt, requests
          tok = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time())+900, "aud": "appstoreconnect-v1"},
              os.environ["ASC_PRIVATE_KEY"], algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          H = {"Authorization": f"Bearer {tok}"}
          r = requests.get(
              "https://api.appstoreconnect.apple.com/v1/builds",
              headers=H, timeout=60,
              params={"filter[app]": os.environ["APP_ID"], "sort": "-uploadedDate",
                      "limit": 8,
                      "fields[builds]": "version,processingState,uploadedDate,expired,usesNonExemptEncryption"})
          if r.status_code >= 300:
              print(r.status_code, r.text[:600]); raise SystemExit(1)
          data = r.json().get("data", [])
          if not data:
              print("No builds found yet (still ingesting?)."); raise SystemExit(0)
          print("=== Recent builds ===")
          for b in data:
              a = b["attributes"]
              print(f"  build {a.get('version')}: {a.get('processingState')} "
                    f"| uploaded {a.get('uploadedDate')} | expired={a.get('expired')} "
                    f"| encryption={a.get('usesNonExemptEncryption')}")
          PY
