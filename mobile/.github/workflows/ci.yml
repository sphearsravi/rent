# Flutter tenant app CI — Sprint 4 A7.
# Gates per PR: pub get + analyze + test. Debug APK as a build artifact.
name: flutter-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Verify formatting
        # Soft-fail for now; switch to required once the codebase is clean.
        run: dart format --output=none --set-exit-if-changed . || echo "::warning::dart format would change files"

      - name: Regenerate localizations (sanity)
        # If anyone added arb keys without checking in the generated dart,
        # `flutter gen-l10n` here will regenerate them. We then `git diff
        # --exit-code` so the PR fails if generated output drifts.
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n || (echo "::error::flutter gen-l10n produced changes; commit them" && exit 1)

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL || 'https://api.example.com/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: tenant-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
