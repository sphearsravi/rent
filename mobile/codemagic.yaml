# Codemagic CI/CD — builds a signed iOS IPA for the Viijar Tenant app.
# iOS builds require macOS; this runs on Codemagic's mac_mini instances so you
# don't need a Mac locally.
#
# ── ONE-TIME SETUP IN THE CODEMAGIC UI (do these before the first build) ──
#   1. Apple Developer Program membership ($99/yr).
#   2. Register the App ID `com.viijar.tenant` in App Store Connect and create
#      the app record there (note its Apple ID number → APP_STORE_APPLE_ID).
#   3. Create an App Store Connect API key (Users and Access → Integrations →
#      App Store Connect API). Then in Codemagic, create an environment
#      variable group named `appstore_credentials` holding three SECRET vars:
#      APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER and
#      APP_STORE_CONNECT_PRIVATE_KEY (the whole .p8 file, BEGIN/END lines).
#   4. Connect this git repository to a Codemagic application.
#   5. Fill the TODOs marked below.
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-flutter-app/

workflows:
  ios-release:
    name: iOS Release (IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
      vars:
        # Production HTTPS API — same backend as Android. iOS ATS requires HTTPS;
        # alrtam.co is served over HTTPS so this satisfies ATS.
        API_BASE_URL: "https://www.alrtam.co/api"
        # Apple ID of the App Store Connect app record (com.viijar.tenant).
        APP_STORE_APPLE_ID: 6795531787
        BUNDLE_ID: "com.viijar.tenant"
      flutter: 3.24.5
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up code signing (create distribution cert + App Store profile)
        script: |
          set -e
          keychain initialize
          # This Apple account had NO signing certificate and NO provisioning profile.
          # Generate a private key so fetch-signing-files --create makes BOTH the iOS
          # Distribution certificate (from this key) AND the App Store profile.
          openssl genrsa -out /tmp/ios_signing_key.pem 2048
          app-store-connect fetch-signing-files "com.viijar.tenant" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/ios_signing_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          # Auto-increment the build number off the latest TestFlight build.
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
          flutter build ipa --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      # Emails you the IPA when the build finishes.
      email:
        recipients:
          - sphearsravi@gmail.com
        notify:
          success: true
          failure: true
      # Uploads the IPA to TestFlight automatically. Set to false to just get
      # the artifact without publishing while you're still testing the pipeline.
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
