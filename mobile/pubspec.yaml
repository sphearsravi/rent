name: viijar_tenant
description: Alrtam Rent Collection Tenant App - Mobile app for tenants to manage rent payments, view leases, and submit maintenance requests.
publish_to: 'none'
version: 1.0.0+21

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localization (Arabic RTL + English)
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP Client
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # URL Launcher (for payment gateway)
  url_launcher: ^6.2.2

  # File Picker (for document upload)
  file_picker: ^6.1.1

  # Receipt PDF + maintenance photo flow
  path_provider: ^2.1.4   # temp dir to save downloaded receipts
  open_filex: ^4.5.0      # open downloaded PDF in system viewer
  image_picker: ^1.1.2    # camera + gallery for maintenance photos

  # Date Formatting
  intl: ^0.19.0

  # Image Handling
  cached_network_image: ^3.3.1

  # Icons
  cupertino_icons: ^1.0.6

  # Sprint 26 — Firebase Cloud Messaging for push notifications.
  # Requires android/app/google-services.json from a Firebase project.
  # See docs/PUSH_NOTIFICATIONS_SETUP.md. Until the file is real, the
  # FcmService runs in stub mode and just logs token-fetch attempts.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Pull to Refresh
  pull_to_refresh: ^2.0.0

  # Toast Messages
  fluttertoast: ^8.2.4

  # Loading Indicators
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  # Financial test suite (WS-A) — no-codegen mocking for ViewModel unit tests.
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

# App icon configuration - place your 1024x1024 PNG at assets/icons/app_icon.png
# Then run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true   # App Store rejects icons with an alpha channel
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#151513"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true
  # Enables the gen-l10n tool to read lib/l10n/*.arb files into
  # AppLocalizations. Run `flutter gen-l10n` after editing the .arb files.
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
